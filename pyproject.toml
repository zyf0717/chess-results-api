[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chess-results-api"
version = "0.1.0"
description = "Download Chess-Results tournament files and decode them into typed Python records."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Board Games",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/zyf0717/chess-results-api"

[project.optional-dependencies]
browser = [
    "playwright>=1.51,<2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/chess_results_api"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests/*.py",
    "/docs",
    "/README.md",
    "/CONTRIBUTING.md",
    "/citations.cff",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = ["/tests/fixtures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "-ra"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
